name: Build All Platforms

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows x64
  # ============================================================
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows x64
        run: |
          pyinstaller --onefile --windowed `
            --name "Multi-Thread-Downloader-Windows-x64" `
            app.py

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Thread-Downloader-Windows-x64
          path: dist/Multi-Thread-Downloader-Windows-x64.exe


  # ============================================================
  # Windows x86
  # ============================================================
  windows-x86:
    name: Windows x86
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows x86
        run: |
          pyinstaller --onefile --windowed `
            --name "Multi-Thread-Downloader-Windows-x86" `
            app.py

      - name: Upload Windows x86
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Thread-Downloader-Windows-x86
          path: dist/Multi-Thread-Downloader-Windows-x86.exe


  # ============================================================
  # Linux x64
  # ============================================================
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux x64
        run: |
          pyinstaller --onefile --windowed \
            --name "Multi-Thread-Downloader-Linux-x64" \
            app.py

      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Thread-Downloader-Linux-x64
          path: dist/Multi-Thread-Downloader-Linux-x64


  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    needs:
      - windows-x64
      - windows-x86
      - linux-x64

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: Multi-Thread-Downloader-Windows-x64
          path: release

      - name: Download Windows x86
        uses: actions/download-artifact@v4
        with:
          name: Multi-Thread-Downloader-Windows-x86
          path: release

      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: Multi-Thread-Downloader-Linux-x64
          path: release

      - name: Show release files
        run: |
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Multi-Thread Downloader v1.0.${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release/Multi-Thread-Downloader-Windows-x64.exe
            release/Multi-Thread-Downloader-Windows-x86.exe
            release/Multi-Thread-Downloader-Linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
