name: Build All Platforms

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python-architecture: x64
            output: Multi-Thread-Downloader-Windows-x64.exe

          - arch: x86
            runner: windows-2022
            python-architecture: x86
            output: Multi-Thread-Downloader-Windows-x86.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --clean `
            --name "${{ matrix.output }}" `
            main.py

      - name: Rename output
        shell: pwsh
        run: |
          if (Test-Path "dist/${{ matrix.output }}") {
            Write-Host "Build successful: dist/${{ matrix.output }}"
          } else {
            Write-Error "Build output was not found."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/${{ matrix.output }}

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            output: Multi-Thread-Downloader-Linux-x64

          - arch: x86
            runner: ubuntu-22.04
            output: Multi-Thread-Downloader-Linux-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install 32-bit build dependencies
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --clean \
            --name "${{ matrix.output }}" \
            main.py

      - name: Verify build
        run: |
          if [ -f "dist/${{ matrix.output }}" ]; then
            file "dist/${{ matrix.output }}"
            chmod +x "dist/${{ matrix.output }}"
          else
            echo "Build output was not found."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/${{ matrix.output }}

  release:
    name: Create Release
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release files
        run: |
          mkdir -p release-files

          find release -type f -exec cp {} release-files/ \;

          chmod +x release-files/Multi-Thread-Downloader-Linux-x64 || true
          chmod +x release-files/Multi-Thread-Downloader-Linux-x86 || true

          ls -lah release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Multi-Thread Downloader v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release-files/Multi-Thread-Downloader-Windows-x64.exe
            release-files/Multi-Thread-Downloader-Windows-x86.exe
            release-files/Multi-Thread-Downloader-Linux-x64
            release-files/Multi-Thread-Downloader-Linux-x86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
